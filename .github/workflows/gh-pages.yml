name: github pages

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Keep hugo-version in sync with devbox.json. The standard edition
      # proves the theme builds without extended-only features.
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: false

      # Keep node-version in sync with devbox.json (nodejs@22). The committed
      # package-lock.json must match package.json or npm ci hard-fails.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: |
          npm run typecheck
          npm run typecheck:test
          npm run typecheck:node

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: hugo --minify

      # The theme is consumed standalone from themes/unity. Its
      # example site and bare sites with no config must build without
      # warnings.
      - name: Build theme test sites
        run: npm run test:sites

      # upload-artifact excludes hidden files by default. public/ contains no
      # dotfiles today, and peaceiris/actions-gh-pages creates .nojekyll itself
      # at publish time. If the build ever emits dotfiles into public/, set
      # include-hidden-files: true here or they will be silently dropped.
      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: public
          path: public/

  # The theme promises its module.hugoVersion floor, so its test sites
  # also build on that release. Keep it in sync with the theme's
  # hugo.toml, theme.toml, and baseof.html.
  theme-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: false

      # Node 22.18 and later run the TypeScript build script without a
      # flag. The script imports only Node built-ins, so this job skips
      # npm ci.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build theme test sites
        run: node themes/unity/scripts/build-sites.ts

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: public
          path: public

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

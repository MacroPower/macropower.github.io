# English strings for every label in the theme. Copy this file to
# i18n/<lang>.toml in your site to translate the desktop; keys with
# `one`/`other` are plural forms and receive `.Count`. The js_ keys at the
# end hold the text the scripts write at runtime and follow their own
# placeholder rules, described there. The home terminal's output stays in
# English, like the bash it imitates.


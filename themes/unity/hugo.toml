# Theme configuration. module.hugoVersion.min is the Hugo version floor.
# css.Build exposes the font artifacts that _partials/unity/head/css.html
# preloads from 0.165.0. The guard at the top of baseof.html and
# README.md repeat the floor, and scripts/build-sites.ts checks that they
# match.
[module]
  [module.hugoVersion]
    min = "0.165.0"

  # The standard mounts, plus i18n/ under assets/ so
  # _partials/unity/ui/i18n-en.html can read the theme's own en.toml to list
  # the strings JavaScript needs.
  # Declaring any mount replaces the defaults, so all of them are listed.
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "i18n"
    target = "assets/unity/i18n"

# Hugo merges a theme's markup and taxonomies only into a site that sets
# _merge = "deep" on its own [markup] and [taxonomies] tables. The site's
# own keys win over the theme's.
[markup]
  [markup.highlight]
    # Classes instead of style attributes, so highlighted code passes a
    # Content Security Policy. _partials/unity/head/css.html adds the
    # classes for the site's markup.highlight.style.
    noClasses = false
  # Passes TeX between these delimiters to _markup/render-passthrough.html,
  # which renders it to MathML.
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block  = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)']]

# The categories and series taxonomies back the blog's Places and Series
# lenses. The theme leaves out Hugo's tags taxonomy, so a site that wants
# it adds tag = "tags" beside its _merge.
[taxonomies]
  category = "categories"
  series   = "series"

# Defaults a site inherits (Hugo deep-merges theme params under the
# site's own). exampleSite/hugo.toml documents the full surface.
[params]
  [params.blog]
    # Date formats in the post reader and the post list. :date_medium
    # follows the page's language, such as Jan 2, 2006 or 02.01.2006.
    dateFormat     = ":date_medium"
    listDateFormat = "2006-01-02"
    # Show "N min read" in the post reader.
    readingTime = true
    # Put each post's whole body in the feed instead of its summary.
    feedFullContent = false
    # Open each post with a table of contents. A post's toc front matter
    # overrides this either way.
    toc = false

  [params.desktop]
    # The lock screen, with the Lock and Log Out actions that open it.
    lock = true
    # The HUD, which a tap of Alt opens to search the panel's menus.
    hud = true
    # Preloads of the regular Ubuntu face, and of Ubuntu Mono on the home
    # terminal.
    fontPreload = true
    # Names in the Trash window, or one name. A trailing slash marks a
    # folder. false removes the Trash from the launcher, the Dash, and the
    # desktop. true is not a valid value, and it leaves the Trash empty
    # with a warning.
    trash = [
      "old-resume-FINAL-v3.pdf",
      "passwords.txt",
      "node_modules/",
      ".DS_Store",
      "screenshot-2009-08-14.png",
      "System32/",
    ]
    # The top panel's indicators, in order. Each name renders
    # _partials/unity/indicators/<name>.html.
    indicators = ["messages", "network", "sound", "battery", "clock", "user"]
    # Access points in the network indicator; the first starts connected.
    networks = [
      "home-wifi",
      "coffee-shop-guest",
      { name = "ngrok-tunnel", mono = true },
    ]

  # The accent presets that Edit > Preferences offers, in weight order.
  # params.desktop.accent names the one each page starts with, and the
  # first is the default. _partials/unity/accents.html resolves them, and
  # each label comes from the accent_<name> key in i18n/en.toml. The
  # internal accent block in main.css repeats the orange shades.
  [params.desktop.accents.orange]
    color   = "#DD4814"
    light   = "#E95420"
    lighter = "#FF6C3D"
    dark    = "#B23B11"
    darker  = "#922F0C"
    weight  = 10
  [params.desktop.accents.green]
    color   = "#3A7D2C"
    light   = "#4E9E3A"
    lighter = "#5BAC48"
    dark    = "#2E6322"
    darker  = "#244F1B"
    weight  = 20
  [params.desktop.accents.aubergine]
    color   = "#77216F"
    light   = "#8B2A82"
    lighter = "#DA75CE"
    dark    = "#5E1A57"
    darker  = "#4A1444"
    weight  = 30
  [params.desktop.accents.blue]
    color   = "#2A5F94"
    light   = "#3F87C9"
    lighter = "#579EE2"
    dark    = "#224E79"
    darker  = "#1A3C5E"
    weight  = 40

  [params.home]
    # terminal, or page for the home's content in a plain window.
    layout = "terminal"

  [params.projects]
    # Thresholds behind the projects sidebar's Starred, Forks, and Recent
    # filters.
    minStars     = 100
    minForks     = 6
    recentMonths = 6

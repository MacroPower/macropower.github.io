{{- /*
  Compiles a TypeScript entry through esbuild (IIFE, ES2023 to match the
  tsconfig.json target; minified in production, with inline source maps
  under hugo server),
  fingerprints it, and emits a deferred <script> with an SRI integrity hash.
  baseof.html routes every bundle through here so the build options and the
  script-tag shape are defined once.

  Args (dict): entry   — source path under assets/ (e.g. "unity/js/blog.ts")
               target  — emitted path (e.g. "js/blog.js")
               defines — optional dict of esbuild defines, each a global
                         name mapped to the JavaScript literal that
                         replaces it (e.g. "UP_STUDIO" "false")

  The shims point the xterm and pdf.js package imports at the copies
  vendored under assets/unity/third_party/, so a site builds without npm.
  Call it through partialCached keyed on the entry and on the value of
  every define.
*/ -}}
{{- $shims := dict
  "@xterm/xterm" "unity/third_party/xterm/xterm.mjs"
  "@xterm/addon-fit" "unity/third_party/xterm/addon-fit.mjs"
  "@xterm/addon-web-links" "unity/third_party/xterm/addon-web-links.mjs"
  "pdfjs-dist" "unity/third_party/pdf-js/pdf.min.mjs"
-}}
{{- $opts := dict "targetPath" .target "minify" hugo.IsProduction "format" "iife" "target" "es2023" "shims" $shims -}}
{{- if hugo.IsDevelopment }}{{ $opts = merge $opts (dict "sourceMap" "inline") }}{{ end -}}
{{- with .defines }}{{ $opts = merge $opts (dict "defines" .) }}{{ end -}}
{{- $built := resources.Get .entry | js.Build $opts | resources.Fingerprint -}}
<script defer src="{{ $built.RelPermalink }}" integrity="{{ $built.Data.Integrity }}"></script>

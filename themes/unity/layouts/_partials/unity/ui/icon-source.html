{{- /*
  Reads assets/unity/icons/<name>.svg once per build for unity/icon.html
  and unity/icon-img.html. Returns a dict of:

    svg           the markup to inline. Its root <svg> carries
                  aria-hidden="true", added when the file lacks it,
                  because every icon decorates a control that names itself.
    file          the markup to publish as an image. Its root <svg>
                  declares the SVG namespace, added when the file lacks it,
                  because a browser draws nothing from a standalone SVG
                  without one.
    currentColor  whether the icon paints with currentColor, which only
                  an inline copy inherits from the page.

  Call it through partialCached keyed on the name.
*/ -}}
{{- $out := dict -}}
{{- with resources.Get (printf "unity/icons/%s.svg" .) -}}
  {{- $c := .Content -}}
  {{- $svg := $c -}}
  {{- $file := $c -}}
  {{- with findRE `<svg[^>]*>` $c 1 -}}
    {{- $root := index . 0 -}}
    {{- if not (strings.Contains $root "aria-hidden") -}}
      {{- $svg = replace $c $root (replace $root "<svg" `<svg aria-hidden="true"` 1) 1 -}}
    {{- end -}}
    {{- if not (strings.Contains $root "xmlns=") -}}
      {{- $file = replace $c $root (replace $root "<svg" `<svg xmlns="http://www.w3.org/2000/svg"` 1) 1 -}}
    {{- end -}}
  {{- end -}}
  {{- $out = dict "svg" $svg "file" $file "currentColor" (gt (len (findRE `(?i)currentcolor` $c 1)) 0) -}}
{{- else -}}
  {{- errorf "unity/icon.html: unity/icons/%s.svg not found" . -}}
{{- end -}}
{{- return $out -}}

{{ define "main" }}
  <article class="up-404 up-selectable">
    <div class="up-empty-pane">
      <div class="up-empty-pane-inner">
        <span class="up-empty-pane-icon" aria-hidden="true">{{ partial "icon.html" "flat/empty-folder" }}</span>
        <h1 class="up-empty-pane-hint">{{ T "page_does_not_exist" }}</h1>
        <div class="up-empty-pane-tagline" aria-hidden="true">bash: cd: 404: No such file or directory</div>
        {{- $reg := partialCached "site-pages.html" . -}}
        <nav class="up-404-links" aria-label="{{ T "places_instead" }}">
          {{- range $reg.launcherOrder }}{{ with index $reg.pages . }}
          <a href="{{ .url }}">{{ .label }}</a>
          {{- end }}{{ end }}
        </nav>
      </div>
    </div>
  </article>
{{ end }}

{{- /* Markdown images. _partials/unity/markup/image.html resolves the source,
      its dimensions, and its WebP copies. Every image loads lazily and
      decodes off the critical path. */ -}}
{{- $img := partial "unity/markup/image.html" (dict "page" .PageInner "dest" .Destination) -}}
<img src="{{ $img.src }}" alt="{{ .PlainText }}"
  {{- with .Title }} title="{{ . }}"{{ end }}
  {{- with $img.width }} width="{{ . }}" height="{{ $img.height }}"{{ end }}
  {{- with $img.srcset }} srcset="{{ . }}"{{ end }}
  {{- with $img.sizes }} sizes="{{ . }}"{{ end }}
  loading="lazy" decoding="async"
  {{- range $k, $v := .Attributes -}}
    {{- if $v }}{{ printf " %s=%q" $k ($v | transform.HTMLEscape) | safeHTMLAttr }}{{ end -}}
  {{- end -}}>
{{- /**/ -}}

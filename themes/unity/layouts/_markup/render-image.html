{{- /* Markdown images. _partials/markup/image.html resolves the source
      and its dimensions. Every image loads lazily and decodes off the
      critical path. */ -}}
{{- $img := partial "markup/image.html" (dict "page" .PageInner "dest" .Destination) -}}
<img src="{{ $img.src }}" alt="{{ .PlainText }}"
  {{- with .Title }} title="{{ . }}"{{ end }}
  {{- with $img.width }} width="{{ . }}" height="{{ $img.height }}"{{ end }}
  {{- with $img.srcset }} srcset="{{ . }}" sizes="(max-width: 840px) 100vw, 800px"{{ end }}
  loading="lazy" decoding="async"
  {{- range $k, $v := .Attributes -}}
    {{- if $v }}{{ printf " %s=%q" $k ($v | transform.HTMLEscape) | safeHTMLAttr }}{{ end -}}
  {{- end -}}>
{{- /**/ -}}

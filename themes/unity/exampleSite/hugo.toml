# Example site for the unity theme. Run it from the theme directory:
#
#   hugo server -s exampleSite --themesDir ../..

baseURL = "https://example.org/"
title   = "Jane Doe"
locale  = "en-us"
theme   = "unity"

# Markdown. It shows under each post and, as plain text, in the RSS
# feeds. The home feed lists blog posts only.
copyright = "© 2024 Jane Doe. Posts are [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)."

enableRobotsTXT = true
enableEmoji     = true

# The blog section. The post browser, the taxonomy pages, the RSS feed,
# the Dash's Files category, and the home terminal's posts directory all
# read it from here, so content/blog/ works as well as content/posts/.
# Hugo defaults this to the section with the most pages.
mainSections = ["posts"]

# Warning ids to silence. unity-menu-unresolved names a menu.main entry
# whose pageRef finds no page in a language. unity-i18n-missing names
# the keys that fall back to the theme's English, and only a site whose
# default language is not English sees it.
# ignoreLogs = ["unity-menu-unresolved", "unity-i18n-missing"]

# A second language adds a language badge to the top panel. The badge
# shows the first two letters of the language's key, and languageBadge
# replaces them. Each language can also set its own wallpaper, accent,
# accents, fontPreload, and markup.highlight.style. direction = "rtl"
# mirrors the desktop for a right-to-left language.
# [languages.en]
#   weight = 1
# [languages.ar]
#   label     = "العربية"
#   direction = "rtl"
#   weight    = 2
#   [languages.ar.params.desktop]
#     languageBadge = "Ar"
#     accent        = "green"

# Hugo writes assets/jsconfig.json into the site each time it bundles
# the theme's scripts. true stops it. Leave it unset if an editor or tsc
# reads that file.
# [build]
#   noJSConfigInAssets = true

[services.rss]
  # Maximum number of items in the RSS feed.
  limit = 10

# Production builds include Hugo's Google Analytics tag when this is set.
# [services.googleAnalytics]
#   id = "G-XXXXXXXXXX"

# The youtube shortcode loads its players from youtube-nocookie.com when
# privacyEnhanced is set, and renders none when disable is set.
# [privacy.youtube]
#   privacyEnhanced = true

# Hugo writes the sitemap under this file name, and robots.txt names
# it. The value is Hugo's default.
# [sitemap]
#   filename = "sitemap.xml"

[permalinks]
  # Optional. The theme works with any permalink pattern.
  posts = "/posts/:year/:month/:title/"

# Hugo merges a theme's taxonomies and markup into a site only when the
# site sets _merge = "deep" on its own table. Keys set here win over the
# theme's.
[taxonomies]
  # The theme's categories and series taxonomies back the blog sidebar's
  # lenses. To drive them from other taxonomies, set
  # params.blog.taxonomies (see [params] below). The theme leaves out
  # Hugo's tags taxonomy, so a site that wants it adds it here.
  _merge = "deep"
  # tag = "tags"

[markup]
  # The theme's markup highlights code with classes instead of style
  # attributes, and the theme's stylesheet carries the classes for this
  # style. It also passes TeX between \( \), \[ \], and $$ $$ to the
  # theme's math render hook, which renders it to MathML at build time.
  _merge = "deep"
  [markup.highlight]
    # Any Chroma style, light or dark, such as "github".
    style = "monokai"

# JPEG and PNG post images load as WebP copies when WebP makes them
# smaller, and Hugo encodes the copies with these settings. The values
# are Hugo's defaults.
# [imaging.webp]
#   quality = 75
#   hint    = "photo"

[params]
  # Site description for <meta name="description"> and the feeds.
  description = "Jane Doe's personal site, styled after Ubuntu 14.04 Unity."

  # Default share image for Open Graph and Twitter cards, under static/
  # or assets/. A page's own images front matter replaces it. One under
  # assets/ also declares its width and height.
  # images = ["img/share.png"]
  # imageAlt = "Jane Doe's desktop with the terminal open"

  # Browser UI color emitted as <meta name="theme-color">.
  themeColor = "#1b1c1d"

  # Source repository, linked from Help > "View source".
  # repoUrl = "https://github.com/jane/janedoe.example"

  [params.author]
    name = "Jane Doe"
    # email backs the Messages indicator's Compose button.
    email = "jane@example.org"
    # The terminal banner's title row and the focus line beneath it. Both
    # are optional, and the banner leaves out each row the site does not
    # set. jobTitle is also the home page's JSON-LD jobTitle.
    jobTitle = "Software Engineer"
    focus    = "Distributed Systems"
    # Optional. When set, the terminal banner's uptime is your age.
    # Otherwise it counts from the oldest page with a date.
    # born = "1990-01-31"

  [params.desktop]
    # The accent preset the desktop starts with, by its key under
    # accents. The first preset is the default. Visitors can switch it in
    # Edit > Preferences.
    # accent = "brand"
    # Accent presets beside the theme's orange, green, aubergine, and
    # blue. color is required. light, lighter, dark, and darker default
    # to shades mixed from it, label to the key, and weight orders the
    # swatches.
    # false removes a preset.
    # accents.brand = { color = "#0E8420", label = "Brand", weight = 5 }
    # accents.green = false
    # An image that covers the desktop and the lock screen in place of
    # the aubergine gradient. Give a path under assets/ or static/, or a
    # URL.
    # wallpaper = "images/wallpaper.jpg"
    # false stops the pages from preloading the theme's Ubuntu fonts, for
    # a custom.css that sets --up-font-sans and --up-font-mono to others.
    # fontPreload = false
    # The corner watermark's lines. An empty list removes it.
    # label = ["jane/personal-site", "est. 2024"]
    # The Trash window's contents. A trailing slash marks a folder, and
    # false removes the Trash.
    # trash = ["draft-v2-final.docx", "old-site/"]
    # false removes the lock screen with its Lock and Log Out actions.
    # lock = false
    # false removes the HUD and its Alt tap.
    # hud = false
    # The top panel's indicators, in order. Leave a name out to remove its
    # indicator, or add _partials/unity/indicators/<name>.html to the site
    # and name it here.
    # indicators = ["messages", "network", "sound", "battery", "clock", "user"]
    # The network indicator's access points. The first starts connected.
    # networks = ["home-wifi", { name = "wg0", mono = true }]
    # The network name the hotspot broadcasts after a visitor turns it on.
    # hotspot = "jane-laptop"
    # The owner's login on the lock screen, the user menu, and the post
    # sign-offs. user defaults to the author's first name, lowercased.
    # user = "jane"
    # host = "unity"

  [params.blog]
    # Long and numeric date formats (post reader and post list). Hugo's
    # localized :date_medium is the default for the long one.
    dateFormat     = ":date_medium"
    listDateFormat = "2006-01-02"
    # Show "N min read" in the post reader.
    readingTime = true
    # Put each post's whole body in the feed instead of its summary.
    # feedFullContent = true
    # Open each post with a table of contents. A post's toc front matter
    # overrides this either way, and the welcome post sets it.
    # toc = true
    # The taxonomies behind the blog's lenses and post chips. Without
    # category, the blog reads categories, or tags on a site that has tags
    # and no categories.
    # [params.blog.taxonomies]
    #   category = "categories"
    #   series   = "series"

  # The projects page reads data/projects.yaml. Without that file, github
  # names an account whose public repositories the build fetches from the
  # GitHub API instead. The thresholds behind the sidebar's Starred,
  # Forks, and Recent filters show their defaults. exclude, languages,
  # and requireDescription narrow the projects from either source.
  # [params.projects]
  #   github             = "jane"
  #   minStars           = 100
  #   minForks           = 6
  #   recentMonths       = 6
  #   exclude            = ["dotfiles"]
  #   languages          = ["Go", "Rust"]
  #   requireDescription = true

  # The home page is the terminal. layout = "page" renders the home's
  # content in a plain window instead.
  # [params.home]
  #   layout = "page"

  # The home terminal is an SSH session into the site as a guest login,
  # which also titles the terminal's window. Both default from the site:
  # "user" and the host of baseURL.
  # [params.terminal]
  #   user = "guest"
  #   host = "example.org"

  # The Studio plays MIDI files from the site's assets/. Without a
  # playlist it plays every assets/midi/*.mid and *.midi file in file-name
  # order, and a site with no MIDI files gets no Studio. An entry is a path
  # or a { path, title } table, and a track without a title shows as
  # "Track N". This example ships two public-domain tunes under
  # assets/midi/.
  # [params.studio]
  #   playlist = [
  #     { path = "midi/ode-to-joy.mid", title = "Ode to Joy" },
  #     "midi/ah-vous-dirai-je.mid",
  #   ]

  # Social links: terminal banner rows, JSON-LD sameAs, and the home
  # page's rel="me" links. `short` overrides the terminal label. A
  # "github" entry also powers the sponsors page's sponsor button and
  # the projects sidebar's GitHub link, and a "twitter" or "x" entry
  # becomes the twitter:site card metadata. A table of name = "url"
  # pairs, which lists the entries by name, can replace the list:
  # [params.social]
  #   github   = "https://github.com/jane"
  #   mastodon = "https://mastodon.social/@jane"

  [[params.social]]
    name = "github"
    url  = "https://github.com/jane"

  [[params.social]]
    name = "linkedin"
    url  = "https://www.linkedin.com/in/jane/"

  [[params.social]]
    name  = "stackoverflow"
    short = "so"
    url   = "https://stackoverflow.com/users/1/jane"

# menu.main drives the theme's site-pages registry: the launcher dock, the
# Dash's Applications category, the top panel's File menu, and the nav:<key>
# actions. Home is implicit and always first, and an entry with identifier
# "home" changes the Home tile instead of adding one. pageRef points an
# entry at a page and follows its permalink and language. url takes any
# address, and one without a scheme resolves under baseURL, once even when
# it starts with the baseURL's path. An entry whose pageRef finds no page
# and that sets no url drops out with a warning. List unity-menu-unresolved
# in ignoreLogs to silence it.
#
# Each entry can set these [menu.main.params]. icon names an SVG under
# assets/unity/icons/, such as "launcher/cv", and the site can add its
# own there. match = "exact" marks the tile current only on the entry's
# own URL, and "prefix", the default, also on every URL under it. kw
# holds the words the Dash search matches. dashLabel and dashIcon
# replace the Dash tile's label and icon. launcher = false keeps the
# page off the dock and the File menu, and launcher = "running" docks
# it only while it is open. dash = false keeps the page out of the Dash.
[menu]
  # Renames the Home tile, which keeps its icon and exact match.
  # [[menu.main]]
  #   identifier = "home"
  #   name       = "Start"
  #   pageRef    = "/"
  [[menu.main]]
    identifier = "cv"
    name       = "CV"
    pageRef    = "/cv"
    weight     = 2
  [[menu.main]]
    identifier = "projects"
    name       = "Projects"
    pageRef    = "/projects"
    weight     = 3
  [[menu.main]]
    identifier = "blog"
    name       = "Blog"
    pageRef    = "/posts"
    weight     = 4
  [[menu.main]]
    identifier = "sponsors"
    name       = "Sponsors"
    pageRef    = "/sponsors"
    weight     = 5
  [[menu.main]]
    identifier = "solitaire"
    name       = "Solitaire"
    pageRef    = "/solitaire"
    weight     = 6
    [menu.main.params]
      # An easter egg like the Studio: docked only while open, reachable
      # from the Dash or the terminal's `solitaire` command.
      launcher = "running"
  [[menu.main]]
    identifier = "icons"
    name       = "Icons"
    pageRef    = "/icons"
    weight     = 7
    [menu.main.params]
      # The icon vault: searchable in the Dash and linked from
      # Help > Icon vault, but never a dock tile.
      launcher = false

  # menu.help adds links to the end of the top panel's Help menu, by
  # weight. It suits pages that every page must reach but the dock
  # should not hold, such as a privacy notice or an imprint. pageRef and
  # url resolve the same way as in menu.main.
  [[menu.help]]
    name    = "Privacy"
    pageRef = "/privacy"
    weight  = 1
  # [[menu.help]]
  #   name   = "Imprint"
  #   url    = "https://example.org/imprint/"
  #   weight = 2

# English strings for every server-rendered label in the theme. Copy this
# file to i18n/<lang>.toml in your site to translate the desktop; keys
# with `one`/`other` are plural forms and receive `.Count`. The strings
# JavaScript writes at runtime (dialogs, notifications, the terminal)
# stay in English.


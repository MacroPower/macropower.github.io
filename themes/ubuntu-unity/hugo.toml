# Theme configuration. The version floor matches theme.toml: css.Build
# exposes the font artifacts _partials/head/css.html preloads from 0.165.0.
[module]
  [module.hugoVersion]
    extended = false
    min = "0.165.0"

  # The standard mounts, plus i18n/ under assets/ so _partials/ui/i18n.html
  # can read the theme's own en.toml to list the strings JavaScript needs.
  # Declaring any mount replaces the defaults, so all of them are listed.
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "i18n"
    target = "assets/ubuntu-unity/i18n"

# Defaults a site inherits (Hugo deep-merges theme params under the
# site's own). exampleSite/hugo.toml documents the full surface.
[params]
  [params.blog]
    # Date formats in the post reader and the post list.
    dateFormat     = "Jan 2, 2006"
    listDateFormat = "2006-01-02"
    # Show "N min read" in the post reader.
    readingTime = true
    # Put each post's whole body in the feed instead of its summary.
    feedFullContent = false
    # Open each post with a table of contents. A post's toc front matter
    # overrides this either way.
    toc = false

  [params.desktop]
    # Names in the Trash window. A trailing slash marks a folder.
    trash = [
      "old-resume-FINAL-v3.pdf",
      "passwords.txt",
      "node_modules/",
      ".DS_Store",
      "screenshot-2009-08-14.png",
      "System32/",
    ]
    # Access points in the network indicator; the first starts connected.
    networks = [
      "home-wifi",
      "coffee-shop-guest",
      { name = "ngrok-tunnel", mono = true },
    ]

  [params.projects]
    # Thresholds behind the projects sidebar's Starred, Forks, and Recent
    # filters.
    minStars     = 100
    minForks     = 6
    recentMonths = 6

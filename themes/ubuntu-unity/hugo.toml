# Theme configuration. The version floor matches theme.toml: css.Build
# exposes the font artifacts _partials/head/css.html preloads from 0.165.0.
[module]
  [module.hugoVersion]
    extended = false
    min = "0.165.0"

# Defaults a site inherits (Hugo deep-merges theme params under the
# site's own). exampleSite/hugo.toml documents the full surface.
[params]
  [params.blog]
    # Date formats in the post reader and the post list.
    dateFormat     = "Jan 2, 2006"
    listDateFormat = "2006-01-02"
    # Show "N min read" in the post reader.
    readingTime = true

  [params.projects]
    # Thresholds behind the projects sidebar's Starred, Forks, and Recent
    # filters.
    minStars     = 100
    minForks     = 6
    recentMonths = 6

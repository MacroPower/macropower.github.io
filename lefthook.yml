# Run `lefthook install -f` once after cloning, or enter `devbox shell` which
# does it automatically.

pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: "themes/ubuntu-unity/{tsconfig.json,assets/js/**/*.{ts,tsx}}"
      run: npx --no-install tsc -p themes/ubuntu-unity --noEmit
    typecheck-test:
      glob: "themes/ubuntu-unity/{tsconfig.json,tsconfig.test.json,assets/js/**/*.{ts,tsx}}"
      run: npx --no-install tsc -p themes/ubuntu-unity/tsconfig.test.json --noEmit

# Run `lefthook install -f` once after cloning, or enter `devbox shell` which
# does it automatically.

# The default gobwas matcher reads `dir/**/*.ts` as one or more directories
# below `dir`, so it skips files sitting directly in `dir`. Doublestar
# matches zero or more, which lets the globs mirror the tsconfig includes.
glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    typecheck:
      glob:
        - "themes/unity/assets/unity/js/**/*.ts"
        - "themes/unity/tsconfig.json"
      run: npx --no-install tsc -p themes/unity --noEmit
    typecheck-test:
      glob:
        - "themes/unity/assets/unity/js/**/*.ts"
        - "themes/unity/tsconfig*.json"
      run: npx --no-install tsc -p themes/unity/tsconfig.test.json --noEmit

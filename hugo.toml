baseURL = "https://jacobcolvin.com"
title   = "Jacob Colvin"
locale  = "en-us"
theme   = "ubuntu-unity"

# Used by the RSS template (layouts/home.rss.xml).
copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'

enableRobotsTXT = true
enableEmoji     = true

# The blog section: the theme's post browser, feed, and terminal posts
# directory all resolve it from mainSections.
mainSections = ["posts"]

[services.rss]
  # Maximum number of items in the RSS feed.
  limit = 10

[permalinks]
  posts = "/posts/:year/:month/:title/"

[taxonomies]
  category = "categories"
  series   = "series"

[markup]
  [markup.highlight]
    style = "monokai"
  [markup.goldmark.parser.attribute]
    # Enable {#id .class key=val} attribute lists on block and inline elements.
    block = true
    title = true

# Date formats and enableReadingTime keep the theme's defaults.
[params]
  description = "Jacob Colvin is a Lead Software Engineer working on developer platforms and infrastructure, writing about Kubernetes, observability, and open source."

  # Default share image for Open Graph / Twitter cards (a screenshot of
  # the desktop home page); pages can override via front-matter images.
  images = ["/img/og-card.png"]

  # Home subtitle of the index page (the terminal banner's "title" row) and
  # the focus line shown beneath it.
  homeSubtitle = "Lead Software Engineer"
  homeFocus    = "Developer Platforms & Infrastructure"

  # Source repository for this site (linked from the "View source" dialog).
  repoUrl = "https://github.com/MacroPower/macropower.github.io"

  [params.author]
    name  = "Jacob Colvin"
    email = "me@jacobcolvin.com"
    born  = "1996-10-03"

  # Browser UI color emitted as <meta name="theme-color">.
  [params.favicon.color]
    theme = "#1b1c1d"

  # Social icons.

  [[params.social]]
    name = "github"
    url  = "https://github.com/MacroPower"

  [[params.social]]
    name = "linkedin"
    url  = "https://www.linkedin.com/in/colvinjm/"

  [[params.social]]
    name = "twitter"
    url  = "https://twitter.com/0xMacro"

  [[params.social]]
    name = "youtube"
    url  = "https://www.youtube.com/channel/UCZeubjnoztTC_RP_c4YOuYw"

  [[params.social]]
    name  = "stackoverflow"
    short = "so"
    url   = "https://stackoverflow.com/users/4868262/jacob-colvin"

  [[params.social]]
    name  = "hackthebox"
    short = "htb"
    url   = "https://app.hackthebox.com/users/427511"

  [[params.social]]
    name = "steam"
    url  = "https://steamcommunity.com/id/MACROPOWER/"

  [[params.social]]
    name = "discogs"
    url  = "https://www.discogs.com/user/MacroPower"

  [[params.social]]
    name = "reddit"
    url  = "https://www.reddit.com/user/macropower"

# menu.main drives the theme's site-pages registry: the launcher dock, the
# Dash's Applications category, the File menu, and the nav:<key> actions.
# Home is implicit. Per-entry [menu.main.params]: icon, match, kw, dashLabel,
# dashIcon, launcher (false keeps a page off the dock, "running" docks it only
# while it is open), dash (false keeps it out of the Dash). See the theme's
# _partials/site-pages.html.
[menu]
  [[menu.main]]
    identifier = "cv"
    name       = "CV"
    url        = "cv/"
    weight     = 2
  [[menu.main]]
    identifier = "projects"
    name       = "Projects"
    url        = "projects/"
    weight     = 3
  [[menu.main]]
    identifier = "blog"
    name       = "Blog"
    url        = "posts/"
    weight     = 4
  [[menu.main]]
    identifier = "sponsors"
    name       = "Sponsors"
    url        = "sponsors/"
    weight     = 5
  [[menu.main]]
    identifier = "solitaire"
    name       = "Solitaire"
    url        = "solitaire/"
    weight     = 6
    [menu.main.params]
      # Hidden like the Studio: docked only while open, off the File menu,
      # found through the Dash or the terminal's `solitaire` command.
      launcher = "running"
  [[menu.main]]
    identifier = "icons"
    name       = "Icons"
    url        = "icons/"
    weight     = 7
    [menu.main.params]
      # The hidden icon vault: searchable in the Dash and linked from
      # Help > Icon vault, but never a dock tile.
      launcher = false

[server]
  [[server.headers]]
    for = '/**.html'
      [server.headers.values]
        Access-Control-Allow-Origin = "*"
